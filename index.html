<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>행맨 게임</title>
</head>
<body>
  <h1>행맨 게임</h1>
  <p>숨겨진 영어 단어를 맞혀보세요. 알파벳을 입력하세요.</p>
  <div class="game-container">
    <svg height="250" width="200" class="figure-container">
      <line x1="60" y1="20" x2="140" y2="20"/>
      <line x1="60" y1="20" x2="60" y2="230"/>
      <line x1="30" y1="230" x2="90" y2="230"/>
      <line x1="90" y1="20" x2="60" y2="50"/>
      <line x1="140" y1="20" x2="140" y2="50"/>

      <circle cx="140" cy="70" r="20" class="figure-part"/>
      <line x1="140" y1="90" x2="140" y2="160" class="figure-part"/>
      <line x1="140" y1="110" x2="110" y2="140" class="figure-part"/>
      <line x1="140" y1="110" x2="170" y2="140" class="figure-part"/>
      <line x1="140" y1="160" x2="110" y2="190" class="figure-part"/>
      <line x1="140" y1="160" x2="170" y2="190" class="figure-part"/>
    </svg>

    <div class="wrong-letters-container">
      <div id="wrong-letters">
      </div>
    </div>

    <div class="word" id="word">

    </div>
  </div>

  <!-- 최종 메시지 -->
  <div class="popup-container" id="popup-container">
    <div class="popup">
      <h2 id="final-message">승리했습니다!</h2>
      <button id="play-button">다시 시작</button>
    </div>
  </div>

  <!-- 알림 -->
  <div class="notification-container" id="notification-container">
    <p>이미 입력한 글자입니다.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
